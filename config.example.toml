# A reaction to another member's message can qualify one Discord activity day.
track_reactions = true
reaction_activity_days = true
reaction_cooldown_minutes = 10

board_title = "Tribe field report"
accent_color = "54C9A3"
max_session_hours = 12
# Roles allowed to read the board alongside staff with Manage Server.
board_reader_roles = []
missions = [
  "Supply run · Restock a base resource with a tribe lead.",
  "Field scout · Survey an assigned server and report a useful finding.",
  "Base shift · Help an officer complete a maintenance round."
]

# Points scale linearly to each target. Weights must add to 10.
[weights]
tenure = 2
game_days = 3
chat_days = 1
contributions = 4
[targets]
tenure = 14
game_days = 6
chat_days = 5
contributions = 4

# Example format only. Patterns search one message body or one flattened embed.
# Groups: player, server. A channel_servers mapping may supply a missing server.
[patterns]
join = '(?im)^Player: (?P<player>[^\r\n]+) joined (?P<server>[^\r\n]+)$'
leave = '(?im)^Player: (?P<player>[^\r\n]+) left (?P<server>[^\r\n]+)$'
[channel_servers]
# "100000000000000005" = "The Island 101"
